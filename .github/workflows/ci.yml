name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — migrate, seed & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kadahub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kadahub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kadahub_test
      DB_SSL: 'false'
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Syntax-check sources
        working-directory: server
        run: |
          for f in src/**/*.js src/*.js tests/*.js; do node --check "$f"; done

      - name: Run migrations
        working-directory: server
        run: npm run migrate

      - name: Verify seed loads
        working-directory: server
        run: npm run seed

      - name: Run test suite
        working-directory: server
        run: npm test

  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: node node_modules/typescript/bin/tsc -b

      - name: Build
        run: node node_modules/vite/bin/vite.js build
